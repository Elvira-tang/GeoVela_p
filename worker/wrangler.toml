name = "geovela-agent"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[vars]
GEOVELA_ALLOWED_ORIGINS = "https://elvira-tang.github.io,https://geovela-web.pages.dev,http://127.0.0.1:5173,http://127.0.0.1:5174"
GEOVELA_RATE_LIMIT_PER_MINUTE = "20"

# Cloudflare 原生限流绑定：每个 IP 每 60 秒最多 20 次请求
# 若账号不支持该绑定，代码会自动回退到单实例内存限流
[[ratelimits]]
name = "INTENT_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
